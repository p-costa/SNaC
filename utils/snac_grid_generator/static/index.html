<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SNaC Grid Generator</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "three/addons/": "/vendor/three/addons/"
        }
      }
    </script>
    <script src="/vendor/lucide/lucide.min.js"></script>
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">SNaC Grid</div>
      <label class="field field-project">
        <span>Project</span>
        <input id="project-name" type="text" autocomplete="off" />
      </label>
      <label class="field field-small">
        <span>Scalars</span>
        <input id="scalar-count" type="number" min="0" step="1" />
      </label>
      <label class="field field-output">
        <span>Output</span>
        <input id="output-dir" type="text" value="generated/snac_grid_case" autocomplete="off" />
      </label>
      <button id="check-project" class="button" title="Check structured grid"><i data-lucide="circle-check"></i><span>Check</span></button>
      <button id="update-structure" class="button" title="Update connectivity and MPI partitions"><i data-lucide="refresh-cw"></i><span>Update</span></button>
      <button id="repair-grids" class="button" title="Repair grid congruence"><i data-lucide="wand-sparkles"></i><span>Repair</span></button>
      <button id="export-case" class="button primary" title="Write case files"><i data-lucide="hard-drive-download"></i><span>Write</span></button>
      <button id="download-json" class="button icon" title="Download project JSON"><i data-lucide="file-json"></i></button>
      <button id="import-case" class="button icon" title="Import SNaC case from Output"><i data-lucide="folder-input"></i></button>
      <label class="button icon file-button" title="Open project JSON">
        <i data-lucide="folder-open"></i>
        <input id="open-json" type="file" accept="application/json,.json" />
      </label>
      <div class="toolbar-group">
        <button id="open-library" class="button icon" title="Grid library"><i data-lucide="library-big"></i></button>
        <button id="undo-project" class="button icon" title="Undo" disabled><i data-lucide="undo-2"></i></button>
        <button id="redo-project" class="button icon" title="Redo" disabled><i data-lucide="redo-2"></i></button>
      </div>
      <button id="reset-project" class="button icon danger" title="Erase all blocks"><i data-lucide="rotate-ccw"></i></button>
      <div id="status" class="status"></div>
    </header>

    <main class="workspace">
      <aside class="block-panel">
        <div class="panel-head">
          <span>Blocks</span>
          <button id="add-block" class="button icon" title="Add block"><i data-lucide="plus"></i></button>
        </div>
        <div id="block-list" class="block-list"></div>
        <div class="add-adjacent">
          <div class="row">
            <label class="field">
              <span>Face</span>
              <select id="adjacent-face">
                <option value="x+">X+</option>
                <option value="x-">X-</option>
                <option value="y+">Y+</option>
                <option value="y-">Y-</option>
                <option value="z+">Z+</option>
                <option value="z-">Z-</option>
              </select>
            </label>
            <label class="field">
              <span>Size</span>
              <input id="adjacent-size" type="number" value="1" step="any" min="1e-12" />
            </label>
          </div>
          <button id="add-adjacent" class="button"><i data-lucide="panel-top-open"></i><span>Add Adjacent</span></button>
        </div>
        <div class="geometry-tools">
          <div class="section-title">Selection tools</div>
          <div class="tool-row three">
            <label class="field"><span>Axis</span><select id="geometry-axis"><option>x</option><option>y</option><option>z</option></select></label>
            <label class="field"><span>Copies</span><input id="array-count" type="number" value="1" min="1" step="1" /></label>
            <label class="field"><span>Gap</span><input id="array-gap" type="number" value="0" step="any" /></label>
          </div>
          <button id="duplicate-array" class="button"><i data-lucide="copy-plus"></i><span>Duplicate array</span></button>
          <div class="tool-row two">
            <label class="field"><span>Mirror plane</span><input id="mirror-plane" type="number" value="0" step="any" /></label>
            <button id="mirror-blocks" class="button compact"><i data-lucide="flip-horizontal-2"></i><span>Mirror</span></button>
          </div>
          <div class="tool-row two">
            <label class="field"><span>Align</span><select id="align-mode"><option value="lower">Lower</option><option value="center">Center</option><option value="upper">Upper</option></select></label>
            <button id="align-blocks" class="button compact"><i data-lucide="align-center-horizontal"></i><span>Align</span></button>
          </div>
          <div class="tool-row two">
            <label class="field"><span>Snap face</span><select id="snap-face"><option>x+</option><option>x-</option><option>y+</option><option>y-</option><option>z+</option><option>z-</option></select></label>
            <button id="snap-block" class="button compact"><i data-lucide="magnet"></i><span>Snap</span></button>
          </div>
        </div>
        <div class="decomposition-panel">
          <div class="section-title">MPI decomposition</div>
          <label class="field"><span>Total ranks</span><input id="target-ranks" type="number" value="0" min="0" step="1" /></label>
          <div id="decomposition-mode" class="mode-buttons" role="group" aria-label="Decomposition mode">
            <button type="button" data-mode="auto" class="active">Auto</button>
            <button type="button" data-mode="1d">1D</button>
            <button type="button" data-mode="2d">2D</button>
            <button type="button" data-mode="3d">3D</button>
          </div>
          <div id="decomposition-axes" class="axis-choices">
            <span>Partition axes</span>
            <label class="check"><input type="checkbox" data-axis="0" checked /><span>X</span></label>
            <label class="check"><input type="checkbox" data-axis="1" checked /><span>Y</span></label>
            <label class="check"><input type="checkbox" data-axis="2" checked /><span>Z</span></label>
          </div>
          <div class="tool-row two">
            <label class="field"><span>Min cells/split</span><input id="min-local-cells" type="number" value="4" min="1" step="1" /></label>
            <label class="field"><span>Max local aspect</span><input id="max-local-aspect" type="number" value="0" min="0" step="any" /></label>
          </div>
          <button id="balance-decomposition" class="button"><i data-lucide="network"></i><span>Balance</span></button>
          <div id="decomposition-summary" class="decomposition-summary"></div>
        </div>
        <div class="quality-panel">
          <div class="section-title quality-title">
            <span>Grid quality</span>
            <span class="quality-actions">
              <button id="download-report-json" class="button icon" type="button" title="Download quality report as JSON"><i data-lucide="file-json"></i></button>
              <button id="download-report-markdown" class="button icon" type="button" title="Download quality report as Markdown"><i data-lucide="file-text"></i></button>
            </span>
          </div>
          <div id="quality-summary" class="quality-summary"></div>
        </div>
      </aside>

      <section class="viewport-shell">
        <canvas id="scene"></canvas>
        <div class="view-tools">
          <div class="axis-view-tools" role="group" aria-label="Orthographic views">
            <button class="button axis-view" data-axis-view="+x" aria-label="View from +X" aria-pressed="false" title="View from +X">+X</button>
            <button class="button axis-view" data-axis-view="-x" aria-label="View from -X" aria-pressed="false" title="View from -X">-X</button>
            <button class="button axis-view" data-axis-view="+y" aria-label="View from +Y" aria-pressed="false" title="View from +Y">+Y</button>
            <button class="button axis-view" data-axis-view="-y" aria-label="View from -Y" aria-pressed="false" title="View from -Y">-Y</button>
            <button class="button axis-view" data-axis-view="+z" aria-label="View from +Z" aria-pressed="false" title="View from +Z">+Z</button>
            <button class="button axis-view" data-axis-view="-z" aria-label="View from -Z" aria-pressed="false" title="View from -Z">-Z</button>
          </div>
          <button id="focus-selection" class="button icon" title="Fit selected blocks"><i data-lucide="scan-search"></i></button>
          <button id="hide-selected" class="button icon" title="Hide selected blocks"><i data-lucide="eye-off"></i></button>
          <button id="isolate-selected" class="button icon" title="Isolate selected blocks"><i data-lucide="panel-top"></i></button>
          <button id="show-all-blocks" class="button icon" title="Show all blocks"><i data-lucide="eye"></i></button>
          <button id="toggle-clipping" class="button icon" title="Toggle clipping plane"><i data-lucide="slice"></i></button>
          <button id="tool-select" class="button icon active" title="Select blocks"><i data-lucide="mouse-pointer-2"></i></button>
          <button id="tool-move" class="button icon" title="Move selected block"><i data-lucide="move-3d"></i></button>
          <button id="tool-scale" class="button icon" title="Resize selected block"><i data-lucide="scaling"></i></button>
          <button id="toggle-boundaries" class="button icon active" title="Toggle boundary colors: D red, N blue, F green, mixed velocity amber"><i data-lucide="palette"></i></button>
          <button id="toggle-partitions" class="button icon active" title="Toggle MPI partition planes"><i data-lucide="panels-top-left"></i></button>
          <button id="toggle-grid-lines" class="button icon active" title="Toggle selected-block grid lines"><i data-lucide="grid-2x2"></i></button>
          <button id="toggle-spacing-jumps" class="button icon active" title="Toggle interface spacing quality"><i data-lucide="activity"></i></button>
          <button id="fit-view" class="button icon" title="Fit view"><i data-lucide="scan"></i></button>
          <button id="toggle-grid" class="button icon active" title="Toggle ground grid"><i data-lucide="grid-3x3"></i></button>
        </div>
        <div id="clip-tools" class="clip-tools" hidden>
          <div id="clip-axis" class="clip-axis" role="group" aria-label="Clipping axis">
            <button class="active" data-clip-axis="x" aria-pressed="true">X</button>
            <button data-clip-axis="y" aria-pressed="false">Y</button>
            <button data-clip-axis="z" aria-pressed="false">Z</button>
          </div>
          <input id="clip-position" type="range" min="0" max="1" step="0.001" value="0.5" aria-label="Clipping position" />
          <button id="flip-clipping" class="button icon" title="Flip clipping direction"><i data-lucide="flip-horizontal-2"></i></button>
        </div>
      </section>

      <aside class="inspector">
        <div class="panel-head">
          <span id="block-title">Block</span>
          <button id="remove-block" class="button icon danger" title="Remove block"><i data-lucide="trash-2"></i></button>
        </div>

        <section class="section">
          <div class="section-title">Geometry</div>
          <div class="form-grid two">
            <label class="field"><span>Name</span><input id="block-name" type="text" autocomplete="off" /></label>
            <label class="field"><span>Init</span><select id="inivel"></select></label>
          </div>
          <div class="periodic-grid" id="periodic-grid"></div>
          <div class="matrix" id="geometry-grid"></div>
          <div class="matrix" id="resolution-grid"></div>
        </section>

        <section class="section">
          <div class="section-title">Grid</div>
          <div class="tabs" id="axis-tabs">
            <button data-axis="x" class="active">X</button>
            <button data-axis="y">Y</button>
            <button data-axis="z">Z</button>
          </div>
          <div id="axis-editor"></div>
          <canvas id="spacing-preview" width="520" height="90"></canvas>
          <div id="spacing-stats" class="stats"></div>
        </section>

        <section class="section">
          <div class="section-title">Boundaries</div>
          <div class="form-grid two">
            <label class="check"><input id="infer-connectivity" type="checkbox" checked /> <span>Infer friends</span></label>
            <label class="check"><input id="write-external-grid" type="checkbox" checked /> <span>Write external grid</span></label>
            <label class="field">
              <span>Grid files</span>
              <select id="grid-source">
                <option value="grid">grid/</option>
                <option value="both">grid/ + data/</option>
              </select>
            </label>
          </div>
          <div class="bc-presets">
            <label class="field"><span>Preset</span><select id="bc-preset"><option value="no_slip">No slip</option><option value="free_slip">Free slip</option><option value="moving_wall">Moving wall</option><option value="inlet">Inlet</option><option value="outlet">Outlet</option></select></label>
            <label class="field"><span>Face</span><select id="bc-preset-face"><option>x-</option><option>x+</option><option>y-</option><option>y+</option><option>z-</option><option selected>z+</option></select></label>
            <label class="field"><span>u</span><input id="bc-preset-u" type="number" value="1" step="any" /></label>
            <label class="field"><span>v</span><input id="bc-preset-v" type="number" value="0" step="any" /></label>
            <label class="field"><span>w</span><input id="bc-preset-w" type="number" value="0" step="any" /></label>
            <label class="field"><span>p</span><input id="bc-preset-p" type="number" value="0" step="any" /></label>
            <button id="apply-bc-preset" class="button"><i data-lucide="paint-bucket"></i><span>Apply preset</span></button>
          </div>
          <div id="boundary-table" class="boundary-table"></div>
          <div id="check-results" class="check-results"></div>
        </section>
      </aside>
    </main>

    <dialog id="repair-dialog">
      <div class="dialog-body">
        <div class="dialog-title">Repair grids</div>
        <div id="repair-summary" class="repair-summary"></div>
        <div class="dialog-actions">
          <button id="cancel-repair" class="button" type="button">Cancel</button>
          <button id="confirm-repair" class="button primary" type="button">Apply</button>
        </div>
      </div>
    </dialog>

    <dialog id="recovery-dialog">
      <div class="dialog-body">
        <div class="dialog-title">Recover project</div>
        <div id="recovery-summary" class="repair-summary"></div>
        <div class="dialog-actions">
          <button id="discard-recovery" class="button" type="button">Discard</button>
          <button id="restore-recovery" class="button primary" type="button">Restore</button>
        </div>
      </div>
    </dialog>

    <dialog id="library-dialog" class="library-dialog">
      <div class="dialog-body">
        <div class="dialog-heading">
          <div class="dialog-title">Grid library</div>
          <button id="close-library" class="button icon" type="button" title="Close library"><i data-lucide="x"></i></button>
        </div>
        <div id="library-tabs" class="tabs library-tabs" role="tablist">
          <button type="button" data-library-tab="axisPresets" class="active">Axis presets</button>
          <button type="button" data-library-tab="projectTemplates">Case templates</button>
        </div>
        <div class="library-content">
          <label class="field">
            <span>Name</span>
            <input id="library-name" type="text" maxlength="80" autocomplete="off" />
          </label>
          <select id="library-items" class="library-items" size="7" aria-label="Library items"></select>
          <div id="library-summary" class="library-summary"></div>
          <div class="library-actions">
            <button id="apply-library-item" class="button primary" type="button"><i data-lucide="check"></i><span>Apply</span></button>
            <button id="save-library-item" class="button" type="button"><i data-lucide="save"></i><span>Save</span></button>
            <button id="rename-library-item" class="button" type="button"><i data-lucide="pencil"></i><span>Rename</span></button>
            <button id="delete-library-item" class="button danger" type="button"><i data-lucide="trash-2"></i><span>Delete</span></button>
          </div>
        </div>
        <div class="dialog-actions library-file-actions">
          <label class="button file-button" title="Import library JSON">
            <i data-lucide="upload"></i><span>Import</span>
            <input id="import-library" type="file" accept="application/json,.json" />
          </label>
          <button id="export-library" class="button" type="button"><i data-lucide="download"></i><span>Export</span></button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
